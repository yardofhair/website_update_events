<!-- Paste into a Squarespace Code Block (uncheck "Display Source").
     Only edit EVENTS_URL below. -->
<div id="ldrl-events" aria-live="polite">Loading upcoming events…</div>

<style>
  #ldrl-events .ev { display: flex; gap: 1.25rem; padding: 1.1rem 0;
    border-bottom: 1px solid rgba(128,128,128,.35); }
  #ldrl-events .ev:first-child { border-top: 1px solid rgba(128,128,128,.35); }
  #ldrl-events .when { flex: 0 0 9.5rem; font-weight: 700; line-height: 1.3; }
  #ldrl-events .what { flex: 1 1 auto; min-width: 0; }
  #ldrl-events .title { font-size: 1.15em; font-weight: 700; margin: 0 0 .2rem; }
  #ldrl-events .where { opacity: .75; margin: 0 0 .5rem; }
  #ldrl-events .links a { margin-right: 1rem; text-decoration: underline; }
  #ldrl-events .badge { display: inline-block; margin-left: .5rem; padding: .1rem .5rem;
    font-size: .7em; font-weight: 700; letter-spacing: .04em; vertical-align: middle;
    border: 1px solid currentColor; border-radius: 3px; }
  @media (max-width: 600px) {
    #ldrl-events .ev { flex-direction: column; gap: .3rem; }
    #ldrl-events .when { flex-basis: auto; }
  }
</style>

<script>
(function () {
  // >>> Change this to wherever you host events.json (must be a public https URL) <<<
  var EVENTS_URL = "https://YOUR-USERNAME.github.io/YOUR-REPO/events.json";

  var root = document.getElementById("ldrl-events");
  var MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];

  // "2027-01-23T08:00:00" -> {y, m, d}. Parsed by hand so the viewer's time zone can't shift the date.
  function parts(s) { var p = s.slice(0, 10).split("-"); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }

  function dateRange(startStr, endStr) {
    var a = parts(startStr), b = parts(endStr || startStr);
    if (a.y === b.y && a.m === b.m && a.d === b.d) return MONTHS[a.m] + " " + a.d + ", " + a.y;
    if (a.y === b.y && a.m === b.m) return MONTHS[a.m] + " " + a.d + "–" + b.d + ", " + a.y;
    if (a.y === b.y) return MONTHS[a.m] + " " + a.d + " – " + MONTHS[b.m] + " " + b.d + ", " + a.y;
    return MONTHS[a.m] + " " + a.d + ", " + a.y + " – " + MONTHS[b.m] + " " + b.d + ", " + b.y;
  }

  function todayStr() {
    var n = new Date(), pad = function (x) { return (x < 10 ? "0" : "") + x; };
    return n.getFullYear() + "-" + pad(n.getMonth() + 1) + "-" + pad(n.getDate());
  }

  function safeUrl(u) { return /^https:\/\//i.test(u || "") ? u : null; }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function link(href, label) {
    var a = el("a", "", label);
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    return a;
  }

  // Show the video only once its scheduled publish time has passed.
  function videoVisible(ev) {
    if (!ev.youtubeId) return false;
    if (!ev.publishAt) return true;
    var t = new Date(ev.publishAt).getTime();
    return !isNaN(t) && t <= Date.now();
  }

  function render(events) {
    var today = todayStr();
    var upcoming = events
      .filter(function (e) { return (e.end || e.start).slice(0, 10) >= today; })
      .sort(function (a, b) { return a.start < b.start ? -1 : 1; });

    root.textContent = "";
    if (!upcoming.length) {
      root.textContent = "No upcoming events are scheduled right now. Check back soon!";
      return;
    }

    upcoming.forEach(function (ev) {
      var soldOut = /sold\s*out/i.test(ev.title);
      var cleanTitle = ev.title.replace(/\*?\s*sold\s*out\s*(\/\s*waitlist\s*only)?\s*\*?[:,-]?\s*/i, "").trim() || ev.title;

      var row = el("div", "ev");
      row.appendChild(el("div", "when", dateRange(ev.start, ev.end)));

      var what = el("div", "what");
      var h = el("p", "title", cleanTitle);
      if (soldOut) h.appendChild(el("span", "badge", "SOLD OUT"));
      what.appendChild(h);

      var place = [ev.venue, [ev.city, ev.state].filter(Boolean).join(", ")].filter(Boolean).join(" · ");
      if (place) what.appendChild(el("p", "where", place));

      var links = el("p", "links");
      if (safeUrl(ev.url)) links.appendChild(link(ev.url, "Event details"));
      if (videoVisible(ev)) links.appendChild(link("https://youtu.be/" + encodeURIComponent(ev.youtubeId), "Watch video"));
      if (links.childNodes.length) what.appendChild(links);

      row.appendChild(what);
      root.appendChild(row);
    });
  }

  fetch(EVENTS_URL, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) { render(data.events || []); })
    .catch(function () {
      root.textContent = "Event schedule is temporarily unavailable. Please check back soon.";
    });
})();
</script>
